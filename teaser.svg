<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="yagni — the 100-day decision list">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101823"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="880" height="440" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="878" height="438" rx="15" fill="none" stroke="#30363d"/>

  <!-- headline -->
  <text x="64" y="120" font-family="system-ui, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="10" fill="#58a6ff">YAGNI</text>
  <text x="64" y="158" font-family="system-ui, 'Segoe UI', sans-serif" font-size="22" fill="#e6edf3">You aren't gonna need it — park it for 100 days, then decide.</text>

  <!-- countdown -->
  <text x="64" y="212" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#8b949e">DAY 1</text>
  <text x="816" y="212" text-anchor="end" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#8b949e">DAY 100 · DECIDE</text>
  <rect x="64" y="224" width="752" height="10" rx="5" fill="#21262d"/>
  <rect x="64" y="224" width="602" height="10" rx="5" fill="url(#bar)"/>
  <circle cx="666" cy="229" r="9" fill="#3fb950"/>
  <circle cx="666" cy="229" r="4" fill="#0d1117"/>

  <!-- item cards -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="64" y="268" width="360" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="84" y="292" font-size="15" fill="#e6edf3">ThinkPad X1</text>
    <text x="84" y="312" font-size="13" fill="#8b949e">1 500 € · 38 days left</text>
    <rect x="322" y="288" width="86" height="24" rx="12" fill="none" stroke="#d29922"/>
    <text x="365" y="304" text-anchor="middle" font-size="12" fill="#d29922">waiting</text>

    <rect x="456" y="268" width="360" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="476" y="292" font-size="15" fill="#8b949e" text-decoration="line-through">Mech keyboard</text>
    <text x="476" y="312" font-size="13" fill="#8b949e">day 100 reached</text>
    <rect x="736" y="288" width="64" height="24" rx="12" fill="none" stroke="#3fb950"/>
    <text x="768" y="304" text-anchor="middle" font-size="12" fill="#3fb950">dropped</text>
  </g>

  <!-- privacy strip -->
  <text x="440" y="384" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#8b949e">no accounts · the secret URL is the auth · no cookies · no logs · stdlib only</text>
  <text x="440" y="412" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#484f58">yagni.graphwiz.ai · MIT</text>
</svg>
